<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Rebel Punkworx cultural values</title><desc id="desc">Practical, honest, inclusive, future focused and responsible. How we learn, collaborate and act.</desc><rect width="1200" height="550" rx="20" fill="#fbefcc"/><path d="M0 0H1200V138H0Z" fill="#242426"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="44" fill="#fd6991" font-size="15" letter-spacing="4" font-weight="bold">REBEL PUNKWORX</text><text x="42" y="99" fill="#fffaf0" font-size="44" font-weight="bold">Our cultural values</text><text x="1158" y="95" fill="#f0d951" font-size="16" text-anchor="end">HOW WE LEARN · COLLABORATE · ACT</text><circle cx="128" cy="214" r="45" fill="#ebdc45"/><g transform="translate(128 218)" stroke="#242426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-16-6a18 18 0 1 1 32 0c-3 6-8 9-8 16H-8c0-7-5-10-8-16ZM-7 16H7m-5 6h-4M0-40v6M-32-8h-6m70 0h6M-25-32l5 5m40 0 5-5"/></g><text x="128" y="298" text-anchor="middle" fill="#242426" font-size="23" font-weight="bold">Practical</text><text x="128" y="336" text-anchor="middle" fill="#34342e" font-size="18">Learning should be</text><text x="128" y="363" text-anchor="middle" fill="#34342e" font-size="18">applied, not abstract.</text><text x="128" y="390" text-anchor="middle" fill="#34342e" font-size="18">We focus on doing.</text><circle cx="364" cy="214" r="45" fill="#ebdc45"/><g transform="translate(364 218)" stroke="#242426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-13 24V4l-9-11q-4-7 3-9l7 6v-18q0-8 6-8t6 8v-7q0-8 6-8t6 8v10q0-6 6-6t6 6V1L12 13v11Z"/></g><text x="364" y="298" text-anchor="middle" fill="#242426" font-size="23" font-weight="bold">Honest</text><text x="364" y="336" text-anchor="middle" fill="#34342e" font-size="18">We work on real</text><text x="364" y="363" text-anchor="middle" fill="#34342e" font-size="18">challenges, not</text><text x="364" y="390" text-anchor="middle" fill="#34342e" font-size="18">polished case studies.</text><circle cx="600" cy="214" r="45" fill="#ebdc45"/><g transform="translate(600 218)" stroke="#242426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-26-10Q-13-35 15-26m-6-7 9 8-11 5M25-13Q40 10 18 28m10-1-11 4-2-12M-5 30Q-33 26-31 0m-8 6 9-9 8 10"/><circle r="9"/></g><text x="600" y="298" text-anchor="middle" fill="#242426" font-size="23" font-weight="bold">Inclusive</text><text x="600" y="336" text-anchor="middle" fill="#34342e" font-size="18">Opportunity should not</text><text x="600" y="363" text-anchor="middle" fill="#34342e" font-size="18">depend on background</text><text x="600" y="390" text-anchor="middle" fill="#34342e" font-size="18">or postcode.</text><circle cx="836" cy="214" r="45" fill="#ebdc45"/><g transform="translate(836 218)" stroke="#242426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-18" cy="-15" r="8"/><circle cx="18" cy="-15" r="8"/><circle cy="14" r="8"/><path d="M-30 4q12-20 25-1M5 3q13-19 25 1M-13 34q13-19 26 0M-5-20H5m19 32-8 6M-24 12l8 6"/></g><text x="836" y="298" text-anchor="middle" fill="#242426" font-size="23" font-weight="bold">Future focused</text><text x="836" y="336" text-anchor="middle" fill="#34342e" font-size="18">We prepare young</text><text x="836" y="363" text-anchor="middle" fill="#34342e" font-size="18">people for the world</text><text x="836" y="390" text-anchor="middle" fill="#34342e" font-size="18">ahead, not the one</text><text x="836" y="417" text-anchor="middle" fill="#34342e" font-size="18">behind us.</text><circle cx="1072" cy="214" r="45" fill="#ebdc45"/><g transform="translate(1072 218)" stroke="#242426" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-18 27V-27h29v54Z M11-27l17 6v44l-17 4M-11-18H4v13h-15Z M-11 2H4v14h-15Z"/><path d="M-27-8q-10 16 2 30M-32 15l7 10 7-8"/></g><text x="1072" y="298" text-anchor="middle" fill="#242426" font-size="23" font-weight="bold">Responsible</text><text x="1072" y="336" text-anchor="middle" fill="#34342e" font-size="18">Sustainability is not</text><text x="1072" y="363" text-anchor="middle" fill="#34342e" font-size="18">a theme, it is a</text><text x="1072" y="390" text-anchor="middle" fill="#34342e" font-size="18">responsibility.</text><path d="M42 483H1158" stroke="#242426" opacity=".18"/><text x="42" y="520" fill="#34342e" font-size="17">Everyone has value. Every perspective can contribute.</text><text x="1158" y="520" text-anchor="end" fill="#7e2850" font-size="17" font-weight="bold">Explore Rebel Punkworx →</text></g></svg>